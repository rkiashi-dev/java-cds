name: CI - Build, Test and CDS Benchmark

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/java-cds-*.jar

  cds-benchmark:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Measure startup time WITHOUT CDS
        id: no_cds
        run: |
          JAR=$(ls target/java-cds-*.jar)
          START=$(date +%s%3N)
          java -jar "$JAR"
          END=$(date +%s%3N)
          ELAPSED=$((END - START))
          echo "elapsed_ms=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "No-CDS startup time: ${ELAPSED}ms"

      - name: Generate CDS archive
        run: |
          JAR=$(ls target/java-cds-*.jar)
          java -XX:ArchiveClassesAtExit=application.jsa \
               -Dspring.context.exit=onRefresh \
               -jar "$JAR" || true
          ls -lh application.jsa 2>/dev/null && echo "CDS archive created" || echo "CDS archive not created (JVM may not support it)"

      - name: Measure startup time WITH CDS
        id: with_cds
        run: |
          JAR=$(ls target/java-cds-*.jar)
          if [ -f application.jsa ]; then
            START=$(date +%s%3N)
            java -XX:SharedArchiveFile=application.jsa -jar "$JAR"
            END=$(date +%s%3N)
            ELAPSED=$((END - START))
            echo "elapsed_ms=$ELAPSED" >> "$GITHUB_OUTPUT"
            echo "With-CDS startup time: ${ELAPSED}ms"
          else
            echo "elapsed_ms=N/A" >> "$GITHUB_OUTPUT"
            echo "CDS archive not available, skipping benchmark"
          fi

      - name: Print benchmark summary
        run: |
          NO_CDS="${{ steps.no_cds.outputs.elapsed_ms }}"
          WITH_CDS="${{ steps.with_cds.outputs.elapsed_ms }}"
          echo "============================================"
          echo " CDS Performance Benchmark Summary"
          echo "============================================"
          echo " Without CDS : ${NO_CDS}ms"
          echo " With CDS    : ${WITH_CDS}ms"
          if [ "$WITH_CDS" != "N/A" ] && [ "$NO_CDS" -gt 0 ] && [ "$WITH_CDS" -gt 0 ]; then
            IMPROVEMENT=$(( (NO_CDS - WITH_CDS) * 100 / NO_CDS ))
            echo " Improvement : ~${IMPROVEMENT}%"
          fi
          echo "============================================"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build no-cds image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: no-cds
          push: false
          tags: java-cds:no-cds

      - name: Build with-cds image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: with-cds
          push: false
          tags: java-cds:with-cds

      - name: Run no-cds container and measure startup
        run: |
          docker build --target no-cds -t java-cds:no-cds .
          START=$(date +%s%3N)
          docker run --rm java-cds:no-cds
          END=$(date +%s%3N)
          echo "Docker no-cds startup time: $((END - START))ms"

      - name: Run with-cds container and measure startup
        run: |
          docker build --target with-cds -t java-cds:with-cds .
          START=$(date +%s%3N)
          docker run --rm java-cds:with-cds
          END=$(date +%s%3N)
          echo "Docker with-cds startup time: $((END - START))ms"
